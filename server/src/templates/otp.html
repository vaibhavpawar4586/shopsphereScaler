<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset your password</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;">
        <tr>
            <td style="padding:32px;">
                <h1 style="margin:0 0 16px;font-size:22px;color:#4f46e5;">ShopSphere</h1>
                <p style="margin:0 0 12px;">Hi #{USER_NAME},</p>
                <p style="margin:0 0 20px;">Use this one-time password to reset your password. It expires in 10 minutes.</p>
                <p style="margin:0 0 20px;font-size:32px;letter-spacing:8px;font-weight:bold;text-align:center;">#{OTP}</p>
                <p style="margin:0;font-size:13px;color:#6b7280;">If you did not ask to reset your password, you can ignore this email.</p>
            </td>
        </tr>
    </table>
</body>
</html>
