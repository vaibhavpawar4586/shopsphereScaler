# Netlify build settings for the React frontend (used when the site's base directory is
# the repository root). Redirects - including the /api proxy to Render - live in
# client/public/_redirects so they work whatever base directory Netlify uses.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
