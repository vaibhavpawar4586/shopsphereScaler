# Netlify settings for the React frontend.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API calls to the Render backend. The browser only ever talks to the Netlify site,
# so the login cookie is first-party (Safari and other browsers block cross-site cookies),
# and VITE_BASE_URL can stay empty.
# Change the URL below if your Render service has a different address.
[[redirects]]
  from = "/api/*"
  to = "https://shopsphere-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: send every other route to index.html so React Router can handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
